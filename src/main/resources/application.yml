server:
  port: 8080
  # 优雅关闭，等待活跃请求完成
  shutdown: graceful

spring:
  application:
    name: cloud-notes

  # ===== 数据源配置 =====
  datasource:
    # MySQL 数据库连接地址
    url: jdbc:mysql://localhost:3306/cloud_notes_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useUnicode=true
    # ⚠️ 安全：使用环境变量管理敏感信息，避免硬编码
    username: ${DB_USERNAME:root}      # 从环境变量读取，默认值 root（仅开发环境）
    password: ${DB_PASSWORD:admin123}  # 从环境变量读取，默认值 admin123（仅开发环境）
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP 连接池配置（Spring Boot 2.x 默认连接池）
    hikari:
      minimum-idle: 5                     # 最小空闲连接数
      maximum-pool-size: 20               # 最大连接池数量
      connection-timeout: 30000           # 连接超时时间（毫秒）
      idle-timeout: 600000                # 空闲连接超时时间（10分钟）
      max-lifetime: 1800000               # 连接最大生命周期（30分钟）
      connection-test-query: SELECT 1     # 测试连接是否可用的 SQL

  # ===== Redis 配置 =====
  data:
    redis:
      # Redis 服务器地址
      host: localhost
      # Redis 服务器端口
      port: 6379
      # Redis 数据库索引（默认为 0）
      database: 0
      # Redis 密码（如果没有设置密码，可以不配置）
      password: ${REDIS_PASSWORD:}  # 从环境变量读取，默认为空
      # 连接超时时间（毫秒）
      timeout: 5000
      # Lettuce 连接池配置（Spring Boot 2.x 默认使用 Lettuce）
      lettuce:
        pool:
          # 连接池最大连接数（根据并发量调整，建议 20-50）
          max-active: 20
          # 连接池最大阻塞等待时间（负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接（保持一定数量的空闲连接）
          min-idle: 5
        # 关闭超时时间
        shutdown-timeout: 100ms

  # ===== Flyway 数据库迁移配置 =====
  flyway:
    enabled: true                          # 启用 Flyway
    baseline-on-migrate: true              # 如果数据库已存在表，则创建基线版本
    locations: classpath:db/migration      # SQL 脚本位置
    encoding: UTF-8                        # 脚本编码
    validate-on-migrate: true              # 迁移前验证脚本
    out-of-order: false                    # 不允许乱序执行
    placeholder-replacement: false         # 不替换占位符

  # ===== JPA / Hibernate 配置 =====
  jpa:
    # ⚠️ 重要：使用 Flyway 后，ddl-auto 应设置为 validate 或 none
    # - validate: 只验证表结构，不修改（推荐）
    # - none: 不做任何操作
    # - update: 自动更新表结构（仅开发环境，已被 Flyway 替代）
    hibernate:
      ddl-auto: validate

    # 在控制台打印 SQL 语句（开发环境开启，生产环境建议关闭）
    show-sql: false

    properties:
      hibernate:
        # 格式化 SQL 输出，方便阅读
        format_sql: false
        # 显示 SQL 注释
        use_sql_comments: true
        # 数据库方言（自动检测，也可以显式指定）
        # dialect: org.hibernate.dialect.MySQL8Dialect
        # 批量插入优化
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ===== Jackson JSON 配置 =====
  jackson:
    # 时间格式化
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    # 序列化配置
    default-property-inclusion: non_null  # 忽略 null 值字段

# ===== JWT 配置 =====
jwt:
  # ⚠️ 安全：JWT密钥必须使用环境变量，禁止硬编码
  # 生成强密钥命令：openssl rand -base64 64
  secret: ${JWT_SECRET:pXNNyoWEdZFrc2qSfcv2+eXWFjHKmrAxVNe7DW6gpRVYhfyUNJgC/+dEb+fRhV84MeXWIENLh6v86pJAaqB9wg==}
  expiration: 86400000  # Token 过期时间（毫秒）：24小时 = 24 * 60 * 60 * 1000

# ===== 日志配置 =====
# 注意：详细的日志配置在 logback-spring.xml 中
logging:
  level:
    root: INFO
    com.example.cloudnotes: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  # 日志文件路径（logback-spring.xml 会使用这个配置）
  file:
    path: logs

# ===== SpringDoc OpenAPI (Swagger) 配置 =====
springdoc:
  api-docs:
    path: /v3/api-docs  # OpenAPI 3.0 JSON 文档路径
    enabled: true
  swagger-ui:
    path: /swagger-ui.html  # Swagger UI 访问路径
    enabled: true
    tags-sorter: alpha  # 按字母顺序排序标签
    operations-sorter: alpha  # 按字母顺序排序操作
  show-actuator: false  # 不显示 Actuator 端点

# ===== Spring Boot Actuator（可选，用于健康检查和监控） =====
management:
  endpoints:
    web:
      exposure:
        include: health,info  # 暴露健康检查和应用信息端点
  endpoint:
    health:
      show-details: when-authorized  # 仅授权用户可见详细健康信息