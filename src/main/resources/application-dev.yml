# ===== 开发环境配置 =====

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cloud_notes_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useUnicode=true
    # 开发环境：使用环境变量或默认值
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin123}

  # Flyway 配置（开发环境）
  flyway:
    enabled: true                     # 启用 Flyway
    baseline-on-migrate: true         # 已有表时创建基线
    clean-disabled: false             # 开发环境允许 clean 操作（谨慎使用）

  jpa:
    hibernate:
      # 开发环境选项：
      # - validate: 使用 Flyway 管理表结构（推荐）
      # - update: 快速开发时自动更新（与 Flyway 二选一）
      ddl-auto: validate
    show-sql: true      # 显示 SQL 语句

# JWT 配置（开发环境可以用简单的密钥）
jwt:
  secret: ${JWT_SECRET:pXNNyoWEdZFrc2qSfcv2+eXWFjHKmrAxVNe7DW6gpRVYhfyUNJgC/+dEb+fRhV84MeXWIENLh6v86pJAaqB9wg==}
  expiration: 86400000  # 24小时

# 日志配置
logging:
  level:
    root: INFO
    com.example.cloudnotes: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
